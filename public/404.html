<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Roanoke Valley .NET User Group (RVNUG)</title>
    <script>
      // Single Page Apps for GitHub Pages
      // This script encodes the current URL and redirects to index.html,
      // preserving the intended path so React Router can handle it.
      // See: https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      var search = l.search ? `&q=${encodeURIComponent(l.search.slice(1))}` : '';
      var hash = l.hash ? `#${l.hash.slice(1)}` : '';
      l.replace(`${l.protocol}//${l.host}/?p=${encodeURIComponent(l.pathname.slice(1))}${search}${hash}`);
    </script>
  </head>
  <body></body>
</html>
