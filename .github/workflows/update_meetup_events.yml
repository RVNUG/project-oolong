name: Update Meetup Events

on:
  schedule:
    - cron: '0 1 * * *' # Daily 01:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv playwright

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Create .env file from secrets
        run: |
          echo "MEETUP_GROUP_NAME=${{ secrets.MEETUP_GROUP_NAME || 'roanoke-valley-net-user-group' }}" > .env

      - name: Get Meetup events and generate data
        id: generate_data
        run: |
          if [ -f public/data/events.json ]; then
            OLD_EVENTS=$(jq -S '.events' public/data/events.json)
          else
            OLD_EVENTS=""
          fi

          python scripts/meetup_events.py

          NEW_EVENTS=$(jq -S '.events' public/data/events.json)

          if [ "$OLD_EVENTS" = "$NEW_EVENTS" ] && [ -n "$OLD_EVENTS" ]; then
            echo "No meaningful changes (same events, only timestamp updated)"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Event list has changed"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git add -f public/data/events.json
          fi

      - name: Create Pull Request
        if: steps.generate_data.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: update Meetup events data'
          title: 'chore: update Meetup events data'
          body: |
            Automated update of Meetup events data from the RVNUG Meetup group.

            This PR was automatically generated by the scheduled workflow.
          branch: update-meetup-events-${{ github.run_number }}
          delete-branch: true
          labels: automated, data-update
