name: PR Checks (Build, TypeScript, ESLint)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env file for build
        run: |
          {
            echo "VITE_APP_DISCORD_URL=${VITE_APP_DISCORD_URL}"
            echo "VITE_APP_MEETUP_GROUP_NAME=roanoke-valley-net-user-group"
            echo "VITE_APP_RVNUG_YT_CHANNEL_ID=${YOUTUBE_CHANNEL_ID}"
            echo "VITE_APP_YOUTUBE_DATA_API_KEY=${YOUTUBE_API_KEY}"
            echo "VITE_APP_BASE_URL=${BASE_URL:-/}"
            echo "VITE_GITHUB_REPO=${VITE_GITHUB_REPO:-rvnug/project-oolong}"
            # Intentionally public (SPA bundle). Scope the PAT tightly; see README / SECURITY_SCANNING.md.
            echo "VITE_GITHUB_DISPATCH_TOKEN=${VITE_GITHUB_DISPATCH_TOKEN}"
          } > .env
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.RVNUG_YT_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          VITE_APP_DISCORD_URL: ${{ secrets.VITE_APP_DISCORD_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}
          VITE_GITHUB_DISPATCH_TOKEN: ${{ secrets.VITE_GITHUB_DISPATCH_TOKEN }}

      - name: Build
        run: |
          export NODE_OPTIONS=--max_old_space_size=4096
          npm run build
        env:
          NODE_ENV: production

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript
        run: npx tsc --noEmit

  eslint-check:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npx eslint --no-error-on-unmatched-pattern .

  status-check:
    name: Status Check
    needs: [build-verification, typescript-check, eslint-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.build-verification.result }}" != "success" ] || \
             [ "${{ needs.typescript-check.result }}" != "success" ] || \
             [ "${{ needs.eslint-check.result }}" != "success" ]; then
            echo "::error::One or more checks failed. Please fix the issues before merging."
            exit 1
          fi
          echo "All checks passed!"
