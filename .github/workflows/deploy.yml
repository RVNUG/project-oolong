name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env file for build
        run: |
          {
            echo "VITE_APP_MEETUP_GROUP_NAME=roanoke-valley-net-user-group"
            echo "VITE_APP_RVNUG_YT_CHANNEL_ID=${YOUTUBE_CHANNEL_ID}"
            echo "VITE_APP_YOUTUBE_DATA_API_KEY=${YOUTUBE_API_KEY}"
            echo "VITE_APP_BASE_URL=${BASE_URL:-/}"
            echo "VITE_FEATURE_COMMUNITY_SHOWCASE=${FEATURE_COMMUNITY_SHOWCASE:-false}"
            echo "VITE_GITHUB_REPO=${VITE_GITHUB_REPO:-rvnug/project-oolong}"
            echo "VITE_APP_DISCORD_URL=${VITE_APP_DISCORD_URL}"
            # Intentionally public (SPA bundle). Scope the PAT tightly; see README / SECURITY_SCANNING.md.
            echo "VITE_GITHUB_DISPATCH_TOKEN=${VITE_GITHUB_DISPATCH_TOKEN}"
          } > .env
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.RVNUG_YT_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          FEATURE_COMMUNITY_SHOWCASE: ${{ secrets.FEATURE_COMMUNITY_SHOWCASE }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}
          VITE_APP_DISCORD_URL: ${{ secrets.VITE_APP_DISCORD_URL }}
          VITE_GITHUB_DISPATCH_TOKEN: ${{ secrets.VITE_GITHUB_DISPATCH_TOKEN }}

      - name: Build Verification
        run: |
          export NODE_OPTIONS=--max_old_space_size=4096
          npm run build
        env:
          NODE_ENV: production

  build:
    name: Build site
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Vite embeds VITE_* in the browser bundle. The contact-form dispatch PAT is
      # intentionally public — keep it narrowly scoped (see README / SECURITY_SCANNING.md).
      - name: Create .env file for build
        run: |
          {
            echo "VITE_APP_MEETUP_GROUP_NAME=roanoke-valley-net-user-group"
            echo "VITE_APP_RVNUG_YT_CHANNEL_ID=${YOUTUBE_CHANNEL_ID}"
            echo "VITE_APP_YOUTUBE_DATA_API_KEY=${YOUTUBE_API_KEY}"
            echo "VITE_APP_BASE_URL=${BASE_URL:-/}"
            echo "VITE_APP_DISCORD_URL=${VITE_APP_DISCORD_URL}"
            echo "VITE_FEATURE_COMMUNITY_SHOWCASE=${FEATURE_COMMUNITY_SHOWCASE:-false}"
            echo "VITE_GITHUB_REPO=${VITE_GITHUB_REPO:-rvnug/project-oolong}"
            echo "VITE_GITHUB_DISPATCH_TOKEN=${VITE_GITHUB_DISPATCH_TOKEN}"
          } > .env
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.RVNUG_YT_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          VITE_APP_DISCORD_URL: ${{ secrets.VITE_APP_DISCORD_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          FEATURE_COMMUNITY_SHOWCASE: ${{ secrets.FEATURE_COMMUNITY_SHOWCASE }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}
          VITE_GITHUB_DISPATCH_TOKEN: ${{ secrets.VITE_GITHUB_DISPATCH_TOKEN }}

      - name: Build
        run: |
          export NODE_OPTIONS=--max_old_space_size=4096
          npm run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
