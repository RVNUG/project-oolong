name: Coverage Badge

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-badge
  cancel-in-progress: true

jobs:
  update-badge:
    name: Update coverage badges
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Vitest coverage (hard 80% gate)
        run: npm run test:coverage

      - name: Pytest coverage (soft 80% gate)
        run: |
          pytest
          python scripts/check_python_coverage_soft.py coverage-python/coverage.json 80

      - name: Generate coverage badges
        run: |
          node scripts/generate-coverage-badge.mjs \
            --label vitest \
            --summary coverage/coverage-summary.json \
            --out badges/coverage-vitest.svg \
            --threshold 80
          node scripts/generate-coverage-badge.mjs \
            --label pytest \
            --summary coverage-python/coverage.json \
            --out badges/coverage-pytest.svg \
            --threshold 80

      - name: Commit badges if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage-vitest.svg badges/coverage-pytest.svg
          if git diff --staged --quiet; then
            echo "Coverage badges unchanged."
            exit 0
          fi
          git commit -m "chore: update coverage badges [skip ci]"
          git push
