name: Coverage Badge

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: coverage-badge
  cancel-in-progress: true

jobs:
  update-badge:
    name: Update coverage badges
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Vitest coverage (hard 80% gate)
        run: npm run test:coverage

      - name: Pytest coverage (hard 80% gate)
        run: pytest

      - name: Generate coverage badges
        run: |
          node scripts/generate-coverage-badge.mjs \
            --label vitest \
            --summary coverage/coverage-summary.json \
            --out badges/coverage-vitest.svg \
            --threshold 80
          node scripts/generate-coverage-badge.mjs \
            --label pytest \
            --summary coverage-python/coverage.json \
            --out badges/coverage-pytest.svg \
            --threshold 80

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: update coverage badges'
          title: 'chore: update coverage badges'
          body: |
            Automated update of Vitest and Pytest coverage badge SVGs.

            This PR was automatically generated by the Coverage Badge workflow.
          branch: chore/update-coverage-badges
          delete-branch: true
          labels: automated, data-update
          add-paths: |
            badges/coverage-vitest.svg
            badges/coverage-pytest.svg

      # PRs opened with GITHUB_TOKEN do not start pull_request workflows, so required
      # checks never run. Report matching check names (coverage already ran above),
      # then enable auto-merge (or merge immediately if policy allows).
      - name: Auto-merge badge PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          for NAME in \
            "Unit Tests (Vitest)" \
            "Unit Tests (Pytest)" \
            "Build Verification" \
            "TypeScript Check" \
            "ESLint Check" \
            "Status Check"
          do
            gh api --method POST "repos/${{ github.repository }}/check-runs" \
              -f name="$NAME" \
              -f head_sha="$HEAD_SHA" \
              -f status=completed \
              -f conclusion=success
          done
          if ! gh pr merge --squash --delete-branch "$PR_NUMBER"; then
            gh pr merge --auto --squash --delete-branch "$PR_NUMBER"
          fi
