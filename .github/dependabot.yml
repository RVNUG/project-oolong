# npm only — GitHub Actions + security scanner pins are handled by Renovate
# (see renovate.json) to avoid duplicate PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '01:00'
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /meetup-proxy
    schedule:
      interval: daily
      time: '01:00'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
