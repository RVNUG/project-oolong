[pytest]
testpaths = tests/python
pythonpath = .
addopts =
    --cov=scripts
    --cov-report=term-missing
    --cov-report=json:coverage-python/coverage.json
    --cov-report=html:coverage-python/html
# Soft gate: do not fail the job on coverage %. Soft check runs separately.

[coverage:run]
source = scripts
omit =
    scripts/setup.js
    scripts/check_python_coverage_soft.py
    scripts/generate-coverage-badge.mjs

[coverage:report]
precision = 1
skip_empty = true
