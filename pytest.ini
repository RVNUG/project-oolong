[pytest]
testpaths = tests/python
pythonpath = .
addopts =
    --cov=scripts
    --cov-fail-under=80
    --cov-report=term-missing
    --cov-report=json:coverage-python/coverage.json
    --cov-report=html:coverage-python/html

[coverage:run]
source = scripts
omit =
    */scripts/setup.js
    */scripts/generate-coverage-badge.mjs

[coverage:report]
precision = 1
skip_empty = true
exclude_also =
    pragma: no cover
    if __name__ == .__main__.:
